<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Tarjeta de presentacion</title>
</head>
<body>
	<main class="content">
    	<section>
        	<img src="{{ datos.imagen }}" alt="imagen-perfil">
        	<p>{{ datos.nombre }}</p>
        	<ul>
                <li><a href="{{ datos.bios.github }}">Ver GitHub</a></li>
                <li><a href="{{ datos.bios.linkedin }}">Ver Linkedin</a></li>
                <li><a href="{{ datos.bios.correo }}">Enviar correo</a></li>
            </ul>
        	<p>{{ datos.profesion }}</p>
    	</section>
	</main>
</body>
</html>
